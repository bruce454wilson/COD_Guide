<style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
    max-width: 1000px;
}

h1 {
    margin-bottom: 12px;
}

.index {
    position: sticky;
    top: 0;
    background: white;
    padding: 8px 0;
    border-bottom: 1px solid #ccc;
    z-index: 1000;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
}

.index a {
    margin-right: 10px;
    font-size: 13px;
    color: #1a73e8;
    text-decoration: none;
    font-weight: bold;
}

.index a:hover {
    text-decoration: underline;
}

.index-sep {
    margin-right: 10px;
    color: #bbb;
    font-size: 13px;
    font-weight: normal;
}

.letter-heading,

    margin-top: 40px;
    border-top: 1px solid #ccc;
    padding-top: 10px;
    scroll-margin-top: 60px;
}

.guest-block {
    margin-top: 18px;
    margin-bottom: 24px;
    scroll-margin-top: 60px;
}

.guest-line {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 8px;
}

.appearance,
.episode-block {
    margin-left: 20px;
    margin-bottom: 12px;
}

.row2 {
    color: #444;
    line-height: 1.4;
}

.desc-button {
    margin-left: 8px;
    font-size: 12px;
    padding: 2px 6px;
    cursor: pointer;
}

.description {
    display: none;
    margin-top: 6px;
    padding: 8px 10px;
    background: #f5f5f5;
    border-left: 3px solid #ccc;
    color: #333;
    line-height: 1.4;
    white-space: pre-wrap;
}

a {
    color: #1a73e8;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

.profile-badge {
    display: inline-block;
    margin-left: 10px;
    font-size: 12px;
    font-weight: normal;
    padding: 2px 7px;
    border: 1px solid #1a73e8;
    border-radius: 3px;
    color: #1a73e8;
    vertical-align: middle;
}

.profile-badge:hover {
    background: #e8f0fe;
    text-decoration: none;
}

.patreon-badge {
    display: inline-block;
    margin-left: 6px;
    font-size: 12px;
    font-weight: normal;
    padding: 2px 7px;
    border: 1px solid #f96854;
    border-radius: 3px;
    color: #f96854;
    vertical-align: middle;
}

.patreon-badge:hover {
    background: #fff0ee;
    text-decoration: none;
}

.youtube-badge {
    display: inline-block;
    margin-left: 6px;
    font-size: 12px;
    font-weight: normal;
    padding: 2px 7px;
    border: 1px solid #cc0000;
    border-radius: 3px;
    color: #cc0000;
    vertical-align: middle;
}

.youtube-badge:hover {
    background: #fff0f0;
    text-decoration: none;
}

.instagram-badge {
    display: inline-block;
    margin-left: 10px;
    font-size: 12px;
    font-weight: normal;
    padding: 2px 7px;
    border: 1px solid #c13584;
    border-radius: 3px;
    color: #c13584;
    vertical-align: middle;
}

.instagram-badge:hover {
    background: #fdf0f7;
    text-decoration: none;
}

/* --- home nav dropdown --- */
.home-nav { position: relative; display: inline-block; vertical-align: middle; }
.home-nav-arrow {
    background: none; border: none; padding: 0 1px 0 3px; cursor: pointer;
    font-size: 9px; color: currentColor; opacity: 0.55; vertical-align: middle;
    line-height: 1; font-family: inherit;
}
.home-nav-arrow:hover { opacity: 1; }
.home-nav-dropdown {
    display: none;
    position: fixed;
    background: white; border: 1px solid #ddd; border-radius: 5px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    white-space: nowrap; z-index: 2000; min-width: 145px;
}
.home-nav-dropdown.open { display: block; }
.home-nav-dropdown a {
    display: block; padding: 8px 14px;
    color: #333 !important; font-weight: normal !important;
    text-decoration: none; font-size: 13px;
}
.home-nav-dropdown a:first-child { border-radius: 5px 5px 0 0; }
.home-nav-dropdown a:last-child  { border-radius: 0 0 5px 5px; }
.home-nav-dropdown a:hover { background: #f5f5f5; color: #1a73e8 !important; }

/* ── Mobile ─────────────────────────────────────────────────── */
@media (max-width: 650px) {
    body {
        margin: 14px;
        font-size: 18px;
    }
    .guest-line {
        font-size: 20px;
    }
    .index a {
        font-size: 16px;
        margin-right: 10px;

    }
    .appearance,
    .episode-block {

    }

    .patreon-badge,

        padding: 5px 10px;

        margin-top: 6px;

    }
    .desc-button {
        font-size: 14px;
        padding: 5px 10px;
        margin-left: 0;
        margin-top: 6px;
    }
    .home-nav-dropdown a {
        font-size: 16px;
        padding: 11px 16px;
    }
    .icon-btn {
        width: 32px;
        height: 32px;
        font-size: 16px;
    }
}

.nav-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}
.icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid #ccc;
    background: #fff;
    color: #555;
    font-size: 14px;
    font-weight: bold;
    text-decoration: none;
    line-height: 1;
    flex-shrink: 0;
}
.icon-btn:hover {
    background: #f0f0f0;
    border-color: #999;
    color: #333;
    text-decoration: none;
}
.lede { color: #555; margin-top: 4px; margin-bottom: 24px; }
.settings-list { max-width: 640px; }
.setting-row {
    display: flex; align-items: center; gap: 18px;
    padding: 16px 0; border-bottom: 1px solid #eee;
    cursor: pointer;
}
.setting-row:last-child { border-bottom: none; }
.setting-text { flex: 1; }
.setting-title { display: block; font-size: 16px; font-weight: bold; color: #222; }
.setting-desc { display: block; font-size: 13px; color: #666; margin-top: 3px; line-height: 1.4; }

/* iOS-style toggle switch */
.toggle-switch { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #ccc; border-radius: 26px; transition: background 0.15s;
}
.toggle-slider::before {
    content: ""; position: absolute; width: 20px; height: 20px;
    left: 3px; bottom: 3px; background: #fff; border-radius: 50%;
    transition: transform 0.15s;
}
.toggle-switch input:checked + .toggle-slider { background: #1a73e8; }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }

.more-note { font-size: 13px; color: #999; font-style: italic; margin-top: 24px; }

@media (max-width: 650px) {
    .setting-title { font-size: 18px; }
    .setting-desc { font-size: 14px; }
}

<script>
function toggleDescription(id, btn) {
    const el = document.getElementById(id);
    if (!el) return;

    const isOpen = el.style.display === "block";
    el.style.display = isOpen ? "none" : "block";
    btn.textContent = isOpen ? "Show description" : "Hide description";
    btn.setAttribute("aria-expanded", String(!isOpen));
}

function toggleHomeNav(btn) {
    const dd = btn.nextElementSibling;
    const opening = !dd.classList.contains('open');
    document.querySelectorAll('.home-nav-dropdown.open').forEach(function(el) {
        el.classList.remove('open');
    });
    if (opening) {
        const rect = btn.getBoundingClientRect();
        dd.style.top = (rect.bottom + 4) + 'px';
        dd.style.left = rect.left + 'px';
        dd.classList.add('open');
        setTimeout(function () {
            document.addEventListener('click', function closeDD(e) {
                if (!btn.closest('.home-nav').contains(e.target)) {
                    dd.classList.remove('open');
                    document.removeEventListener('click', closeDD);
                }
            });
        }, 0);
    }
}
</script>

<h1>Settings</h1>

<div class="index">
<span class="home-nav"><a href="danceexplorer.html">&#8592;&nbsp;Home</a><button class="home-nav-arrow" onclick="toggleHomeNav(this)" aria-label="Site navigation">&#9662;</button><div class="home-nav-dropdown"><a href="podcasts.html">Podcasts</a><a href="performances.html">Performances</a></div></span>
<span class="nav-right"><a href="settings.html" class="icon-btn" title="Settings" aria-label="Settings">&#9881;</a><a href="help.html" class="icon-btn" title="Help" aria-label="Help">?</a></span>
</div>
<p class="lede">Options that affect the site but aren't needed often. Changes take effect the next time you open an affected page.</p>
<div class="settings-list">
<label class="setting-row"><span class="setting-text"><span class="setting-title">Show past programs</span><span class="setting-desc">Include programs that have already ended on the Agenda, By Company, and Grid performance pages.</span></span><span class="toggle-switch"><input type="checkbox" id="opt-de_perf_past"><span class="toggle-slider"></span></span></label>
</div>

<p class="more-note">More options will appear here as new features roll out.</p>
<script>
(function () {
    var OPTION_KEYS = ["de_perf_past"];
    OPTION_KEYS.forEach(function (key) {
        var el = document.getElementById('opt-' + key);
        if (!el) return;
        el.checked = localStorage.getItem(key) === '1';
        el.addEventListener('change', function () {
            try { localStorage.setItem(key, el.checked ? '1' : '0'); } catch (e) {}
        });
    });
})();
</script>
<script>
(function () {
    // Best-effort: tell Chrome not to restore a stale scroll position.
    // This works on the first visit; on subsequent visits Chrome may have
    // already committed to restoration before scripts run — the guard below
    // handles that case.
    if (window.location.hash && 'scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
    }

    function _navH() {
        var nav = document.querySelector('.index, .alpha-nav, .company-nav');
        return nav ? Math.ceil(nav.getBoundingClientRect().height) + 8 : 60;
    }

    // Same-page anchor clicks (A-Z nav, Jump To links that stay on this page).
    document.addEventListener('click', function (e) {
        var a = e.target.closest('a');
        if (!a) return;
        var href = a.getAttribute('href');
        if (!href || href.charAt(0) !== '#' || href.length < 2) return;
        var target = document.getElementById(href.slice(1));
        if (!target) return;
        e.preventDefault();
        target.style.scrollMarginTop = _navH() + 'px';
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.pushState(null, '', href);
    });

    // Cross-page hash arrival.
    if (window.location.hash) {
        var _h = window.location.hash;
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                var target = document.getElementById(_h.slice(1));
                if (!target) return;
                var nav = document.querySelector('.index, .alpha-nav, .company-nav');
                var rawNavH = nav ? Math.ceil(nav.getBoundingClientRect().height) : 0;
                target.style.scrollMarginTop = (rawNavH + 8) + 'px';
                target.scrollIntoView({ behavior: 'instant', block: 'start' });

                // Scroll guard: if Chrome's restoration fires after our
                // correction (moving us to the wrong position), snap back.
                // We distinguish restoration (no prior user gesture) from
                // deliberate scrolling (mousedown / wheel / touch / key fires
                // before the resulting scroll event).
                var anchorY = window.scrollY;
                var guardOn = true;
                var userScrolled = false;
                ['mousedown', 'touchstart', 'keydown', 'wheel'].forEach(function (t) {
                    window.addEventListener(t, function () { userScrolled = true; }, { passive: true });
                });
                setTimeout(function () { guardOn = false; }, 1500);
                var _g = function () {
                    if (!guardOn) { window.removeEventListener('scroll', _g); return; }
                    if (userScrolled) {
                        guardOn = false;
                        window.removeEventListener('scroll', _g);
                        return;
                    }
                    if (Math.abs(window.scrollY - anchorY) > 20) {
                        window.scrollTo(0, anchorY);
                    }
                };
                window.addEventListener('scroll', _g);
            });
        });
    }
})();
</script>
